server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # Angular emits content-hashed file names (main-ABC123.js), so they can be cached forever.
    location ~* "-[A-Z0-9]{8}\.(js|css)$" {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # index.html must always be revalidated so new deployments are picked up.
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    # SPA fallback: unknown paths (e.g. /runs, /artifacts/mcc-pipeline) are routed by Angular.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
