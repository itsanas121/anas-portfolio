# Test every change; on main, publish the image to Docker Hub and redeploy the server.
name: CI / Deploy

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  IMAGE: itsanas121/anas-portfolio
  CONTAINER: anas-portfolio

jobs:
  test:
    name: Test and build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - run: npm ci --legacy-peer-deps
      - run: npx ng test --watch=false
      - run: npm run build

  publish:
    name: Push image to Docker Hub
    needs: test
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # Tag with the commit SHA as well, so any release can be rolled back to.
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ env.IMAGE }}:latest
            ${{ env.IMAGE }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: Deploy to server
    needs: publish
    runs-on: ubuntu-latest
    # Never run two deployments at the same time.
    concurrency:
      group: production
      cancel-in-progress: false
    steps:
      - uses: appleboy/ssh-action@v1.2.2
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          port: ${{ secrets.SERVER_PORT || 22 }}
          script: |
            set -e
            docker pull ${{ env.IMAGE }}:${{ github.sha }}
            docker rm -f ${{ env.CONTAINER }} 2>/dev/null || true
            docker run -d \
              --name ${{ env.CONTAINER }} \
              --restart unless-stopped \
              -p ${{ vars.HOST_PORT || '80' }}:80 \
              ${{ env.IMAGE }}:${{ github.sha }}
            # The server is shared: only clean up older versions of this image, nothing else.
            docker images ${{ env.IMAGE }} --format '{{.Repository}}:{{.Tag}}' \
              | grep -v ':${{ github.sha }}$' \
              | xargs -r docker rmi 2>/dev/null || true
